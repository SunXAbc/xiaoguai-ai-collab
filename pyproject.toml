[project]
name = "xiaoguai-collab"
version = "0.3.0"
license = "MIT"
description = "本机多 AI MCP 协作中心及原生 MFC 查看窗口"
requires-python = ">=3.13"
dependencies = ["mcp==2.3.0", "uvicorn==0.54.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "BLE001", "TRY004", "PLW1510"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
